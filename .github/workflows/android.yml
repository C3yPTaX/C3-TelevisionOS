name: Android build

on:
  push:
    branches: [ main, 'claude/**', 'feature/**' ]
    paths-ignore: [ 'docs/**', '**/*.md' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK (R8, dev-signed)
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk c3-tv-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: c3-tv-apk
          path: c3-tv-*.apk
          if-no-files-found: error
