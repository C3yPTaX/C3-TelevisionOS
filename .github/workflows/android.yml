name: Build und Release

on:
  push:
    branches: [ main, 'claude/**', 'feature/**' ]
    paths-ignore: [ 'docs/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: c3-televisionos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    name: TV-App (APK)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Version prüfen
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "VERSION muss x.y.z sein, ist: $VERSION"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Release-APK bauen (R8, Dev-Schlüssel)
        run: ./gradlew --no-daemon assembleRelease

      - name: Dateien vorbereiten
        run: |
          mkdir out
          cp app/build/outputs/apk/release/app-release.apk out/c3-tv.apk
          echo "$VERSION (Build #${{ github.run_number }}, ${GITHUB_SHA::7})" > out/c3-version.txt
          cat out/c3-version.txt

      - uses: actions/upload-artifact@v4
        with:
          name: c3-tv-apk
          path: out/*
          if-no-files-found: error

  updater:
    name: C3 Updater (Windows)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: C3-Updater.exe bauen (in Windows enthaltener .NET-Compiler)
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          New-Item -ItemType Directory -Force out, gen | Out-Null
          Set-Content gen\Version.cs "[assembly: System.Reflection.AssemblyVersion(`"$version.0`")]`n[assembly: System.Reflection.AssemblyTitle(`"C3 Updater`")]`n[assembly: System.Reflection.AssemblyProduct(`"C3 Television OS`")]"
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /codepage:65001 /target:winexe /optimize+ /out:out\C3-Updater.exe `
            /win32icon:tools\updater\C3Updater.ico `
            /reference:System.dll /reference:System.Core.dll /reference:System.Drawing.dll /reference:System.Windows.Forms.dll /reference:System.Web.Extensions.dll /reference:System.Management.dll `
            tools\updater\*.cs gen\Version.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Item out\C3-Updater.exe

      - uses: actions/upload-artifact@v4
        with:
          name: c3-updater
          path: out/C3-Updater.exe
          if-no-files-found: error

  package:
    name: Versioniertes ZIP
    needs: [ apk, updater ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: ZIP erstellen und prüfen
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          ARCHIVE="C3-TelevisionOS_v${VERSION}.zip"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

          # Alles direkt auf ZIP-Ebene, kein zusätzlicher Oberordner.
          mkdir pkg
          cp dist/C3-Updater.exe pkg/
          cp dist/c3-tv.apk "pkg/C3-TelevisionOS_v${VERSION}.apk"
          cp README.md CHANGELOG.md pkg/
          (cd pkg && zip -q -X "../${ARCHIVE}" *)

          python3 - "${ARCHIVE}" "${VERSION}" <<'PY'
          import sys
          from zipfile import ZipFile
          path, version = sys.argv[1], sys.argv[2]
          with ZipFile(path) as z:
              names = z.namelist()
              for required in ("C3-Updater.exe", f"C3-TelevisionOS_v{version}.apk", "README.md", "CHANGELOG.md"):
                  assert required in names, f"{required} fehlt im ZIP-Stamm"
              assert all("/" not in n for n in names), "ZIP darf keinen Oberordner enthalten"
              assert z.testzip() is None, "ZIP ist beschädigt"
          print(f"ZIP geprüft: {path} ({len(names)} Einträge)")
          PY

          grep -q "^## ${VERSION}" CHANGELOG.md || echo "::warning::CHANGELOG.md hat keinen Abschnitt '## ${VERSION}'."

      - uses: actions/upload-artifact@v4
        with:
          name: c3-televisionos-zip
          path: ${{ env.ARCHIVE }}

      # Entwicklerkanal: jeder Push (nicht PRs) ersetzt das Vorab-Release "c3-latest".
      - name: Entwicklerversion "c3-latest" ersetzen
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete c3-latest --yes --cleanup-tag || true
          gh release create c3-latest dist/c3-tv.apk dist/c3-version.txt dist/C3-Updater.exe \
            --prerelease --latest=false \
            --target "$GITHUB_SHA" \
            --title "C3 – Entwicklerversion" \
            --notes "Automatisch aus ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}. $(cat dist/c3-version.txt). Nur zum Testen – stabile Versionen sind die Releases vX.Y.Z."

      # Stabil: jede Versionsnummer bekommt genau ein unveränderliches Release, nur von main.
      - name: Versioniertes Release veröffentlichen
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "::notice::Release v${VERSION} ist bereits vorhanden. Für ein neues Release VERSION erhöhen."
            exit 0
          fi
          NOTES="$(awk -v v="## ${VERSION}" 'index($0, v)==1 {f=1; next} /^## / && f {exit} f' CHANGELOG.md)"
          gh release create "v${VERSION}" "${ARCHIVE}" dist/c3-tv.apk dist/c3-version.txt dist/C3-Updater.exe \
            --target "$GITHUB_SHA" \
            --title "C3 Television OS v${VERSION}" \
            --notes "${NOTES:-Versioniertes Paket.}

          **Installation:** ZIP entpacken, \`C3-Updater.exe\` starten, TV-IP eintragen, „TV aktualisieren“." \
            --latest
